<section class="form-layout"><a class="back-link" routerLink="/projects">← Back to projects</a><div class="page-heading"><div><p class="eyebrow">{{ editing ? 'Project settings' : 'New project' }}</p><h1>{{ editing ? 'Edit project' : 'Create project' }}</h1><p class="subtitle">Define the project that owns your domains.</p></div></div>@if (error) { <div class="alert">{{ error }}</div> } @if (loading) { <div class="card loading">Loading project...</div> } @else { <form class="card form-card" [formGroup]="form" (ngSubmit)="save()"><div class="form-grid"><div class="field"><label for="code">Code</label><input id="code" formControlName="code" /><small class="error" *ngIf="form.controls.code.touched && form.controls.code.invalid">Code is required.</small></div><div class="field"><label for="description">Description</label><input id="description" formControlName="description" /><small class="error" *ngIf="form.controls.description.touched && form.controls.description.invalid">Description is required.</small></div></div><div class="form-footer"><a class="btn btn-secondary" routerLink="/projects">Cancel</a><button class="btn btn-primary" type="submit" [disabled]="saving">{{ saving ? 'Saving...' : 'Save project' }}</button></div></form> }</section>
